<title>Finanzas Loli & Tito</title>
<meta name="description" content="Dashboard mensual de gastos conjuntos">
<style>
/* Layout: header sticky con pestañas por mes; por mes: tiles de resumen, reparto 40/60, desglose por categoría y por medio, insights. */
:root{
  --bg:#f4f2ee; --surface:#ffffff; --surface-2:#faf8f4; --fg:#20242b; --muted:#6b7280;
  --line:#e4e0d8; --accent:#15616d; --accent-soft:#d7e6e6; --gold:#b4842f;
  --good:#1f7a5a; --good-bg:#dff0e6; --bad:#b4453a; --bad-bg:#f6dedb;
  --r:14px; --shadow:0 1px 3px rgba(20,24,31,.06),0 6px 20px rgba(20,24,31,.05);
  --font-d:"Fraunces",Georgia,serif; --font-b:"Instrument Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15181d; --surface:#1e222a; --surface-2:#222732; --fg:#eceef2; --muted:#9aa2b0;
  --line:#2c313b; --accent:#58b6c2; --accent-soft:#1d3942; --gold:#d9ad5e;
  --good:#6fd6a8; --good-bg:#16352a; --bad:#f09a8f; --bad-bg:#3a211e;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15181d; --surface:#1e222a; --surface-2:#222732; --fg:#eceef2; --muted:#9aa2b0;
  --line:#2c313b; --accent:#58b6c2; --accent-soft:#1d3942; --gold:#d9ad5e;
  --good:#6fd6a8; --good-bg:#16352a; --bad:#f09a8f; --bad-bg:#3a211e;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);line-height:1.45;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.head-row{max-width:1040px;margin:0 auto;padding:14px 16px 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand{font-family:var(--font-d);font-weight:600;font-size:1.3rem;letter-spacing:.2px}
.brand .amp{color:var(--accent)}
.sub{color:var(--muted);font-size:.82rem}
.ingresos-chip{margin-left:auto;font-size:.78rem;color:var(--muted);white-space:nowrap}
.ingresos-chip b{color:var(--fg);font-variant-numeric:tabular-nums}
.tabs{max-width:1040px;margin:0 auto;padding:10px 16px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  font-family:inherit;font-size:.9rem;font-weight:600;padding:8px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#0b1416}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#0b1416}}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{margin-top:20px}
section.month{display:none}
section.month.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){section.month.active{animation:none}.bar span{transition:none}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow)}
.tile .k{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tile .v{font-family:var(--font-d);font-size:1.5rem;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .d{font-size:.77rem;color:var(--muted);margin-top:4px}
.tile .v.good{color:var(--good)} .tile .v.bad{color:var(--bad)}
.split{display:flex;gap:10px;margin-top:14px}
.split .s{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow)}
.split .s .who{font-size:.76rem;color:var(--muted);font-weight:600}
.split .s .mt{font-family:var(--font-d);font-size:1.18rem;font-variant-numeric:tabular-nums;margin-top:2px}
.split .s .sh{font-size:.72rem;color:var(--muted);margin-top:2px}
.recon{margin-top:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:.86rem;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.recon b{font-variant-numeric:tabular-nums}
.recon .res.bad{color:var(--bad);font-weight:600} .recon .res.good{color:var(--good);font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow)}
.card h3{font-family:var(--font-d);font-size:1.08rem;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3 .tot{font-family:var(--font-b);font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card .lead{font-size:.8rem;color:var(--muted);margin:2px 0 12px}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.row{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:10px}
.row .lbl{font-size:.82rem;display:flex;align-items:center;gap:7px;min-width:0}
.row .lbl .dot{width:9px;height:9px;border-radius:3px;flex:none}
.row .lbl .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:16px;background:var(--surface-2);border-radius:6px;overflow:hidden;min-width:0}
.bar span{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.row .amt{font-size:.82rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .amt .pct{color:var(--muted);font-size:.72rem;margin-left:5px}
.catrow{border-bottom:1px solid transparent}
.catrow summary{list-style:none;display:grid;grid-template-columns:15px 110px 1fr auto;align-items:center;gap:10px;cursor:pointer;padding:3px 0;border-radius:6px}
.catrow summary::-webkit-details-marker{display:none}
.catrow summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.catrow summary:hover{background:var(--surface-2)}
.caret{width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-left:3px}
.catrow[open] .caret{transform:rotate(45deg)}
.catrow summary .lbl{font-size:.82rem;display:flex;align-items:center;gap:7px;min-width:0}
.catrow summary .lbl .dot{width:9px;height:9px;border-radius:3px;flex:none}
.catrow summary .lbl .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow summary .amt{font-size:.82rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.catrow summary .amt .pct{color:var(--muted);font-size:.72rem;margin-left:5px}
.subitems{padding:3px 0 9px 32px;display:flex;flex-direction:column;gap:5px}
.subrow{display:flex;justify-content:space-between;gap:12px;font-size:.8rem;color:var(--muted);min-width:0}
.subrow .sc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subrow .sm{white-space:nowrap;font-variant-numeric:tabular-nums}
@media(max-width:760px){.catrow summary{grid-template-columns:15px 92px 1fr auto}}
.usd-note,.sug{margin-top:14px;border-radius:12px;padding:11px 13px;font-size:.82rem}
.usd-note{background:var(--accent-soft);color:var(--fg)}
.usd-note b{font-variant-numeric:tabular-nums}
.sug{background:var(--surface-2);border:1px dashed var(--line)}
.sug .st{font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sug .vals{display:flex;gap:18px;margin-top:6px;flex-wrap:wrap}
.sug .vals div{font-size:.84rem} .sug .vals b{font-family:var(--font-d);font-size:1.05rem;font-variant-numeric:tabular-nums;display:block}
.whybars{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.wb{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:center}
.wb .wl{font-size:.8rem;color:var(--muted);font-weight:600}
.wtrack{background:var(--surface-2);border-radius:7px;height:26px;overflow:hidden;min-width:0}
.wfill{height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:9px;color:#fff;font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;border-radius:7px;min-width:56px}
:root[data-theme="dark"] .wfill,:root:not([data-theme="light"]) .wfill{color:#0b1416}
ul.ins{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:9px}
ul.ins li{font-size:.86rem;padding-left:20px;position:relative}
ul.ins li::before{content:"";position:absolute;left:4px;top:7px;width:7px;height:7px;border-radius:2px;background:var(--accent)}
ul.ins li.warn::before{background:var(--gold)} ul.ins li.bad::before{background:var(--bad)} ul.ins li.good::before{background:var(--good)}
ul.ins b{font-variant-numeric:tabular-nums}
.note{font-size:.78rem;color:var(--muted);margin-top:14px;padding:11px 13px;background:var(--surface-2);border:1px dashed var(--line);border-radius:10px}
.annual-bars{display:flex;flex-direction:column;gap:13px;margin-top:6px}
.ab{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center}
.ab .m{font-weight:600;font-size:.9rem}
.ab .track{background:var(--surface-2);border-radius:8px;height:32px;position:relative;overflow:hidden}
.ab .fill{height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 65%,var(--gold)));display:flex;align-items:center;justify-content:flex-end;padding-right:10px;color:#fff;font-size:.8rem;font-variant-numeric:tabular-nums;font-weight:600;border-radius:8px;min-width:58px}
:root[data-theme="dark"] .ab .fill,:root:not([data-theme="light"]) .ab .fill{color:#0b1416}
table.mt{width:100%;border-collapse:collapse;font-size:.84rem;margin-top:6px}
table.mt th,table.mt td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.mt th:first-child,table.mt td:first-child{text-align:left}
table.mt th{color:var(--muted);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em}
table.mt td.bad{color:var(--bad)} table.mt td.good{color:var(--good)}
.tbl-scroll{overflow-x:auto}
.foot{text-align:center;color:var(--muted);font-size:.76rem;margin-top:26px}
</style>

<header class="top">
  <div class="head-row">
    <div class="brand">Loli <span class="amp">&amp;</span> Tito</div>
    <div class="sub">Gastos conjuntos · reparto 40 / 60</div>
    <div class="ingresos-chip">Ingresos: Vos <b>$3.000.000</b> · Tito <b>$6.000.000</b></div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
</header>
<main class="wrap" id="main"></main>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<script>
const DATA = {
  ingresos:{loli:3000000, tito:6000000},
  split:{loli:0.40, tito:0.60},
  meses:[
    { id:"sep", nombre:"Septiembre 2026", aportes:{loli:1000000,tito:1500000}, usd:455.99,
      caja:[
        {c:"Expensas Núñez (fideicomiso)","cat":"Expensas",m:799294},
        {c:"Expensas Pilar (consorcio)","cat":"Expensas",m:400612},
        {c:"Limpieza · Graciela Brav","cat":"Limpieza",m:84000},
        {c:"Limpieza · Fredesvinda Palacio","cat":"Limpieza",m:170000},
        {c:"Paseadora Antonio (Andrea Verón)","cat":"Mascota",m:87000},
        {c:"Pilates (Fosque ×2)","cat":"Pilates",m:138000},
        {c:"Débito automático DEBIN","cat":"Otros",m:41999},
        {c:"Ferretería Alzaga (portón)","cat":"Hogar",m:40000},
        {c:"Cabrera Carlos Alberto","cat":"Otros",m:150000},
        {c:"Nicolás García","cat":"Otros",m:6750},
        {c:"“Ya ganaste” (débito)","cat":"Otros",m:58000},
        {c:"ebanxsa (débito)","cat":"Otros",m:10938},
        {c:"Sushi (Juanse)","cat":"Restaurant",m:50000},
      ],
      amex:[
        {c:"Rappi","cat":"Delivery",m:61842},
        {c:"Rappi","cat":"Delivery",m:164937},
        {c:"dlopedidosya propina","cat":"Delivery",m:800},
        {c:"Rappi (Tito)","cat":"Delivery",m:69552},
        {c:"dlorappi (Tito)","cat":"Delivery",m:6490},
        {c:"Rappi (Tito)","cat":"Delivery",m:52432},
        {c:"Rappi (Tito)","cat":"Delivery",m:19177},
        {c:"Rappi (Tito)","cat":"Delivery",m:2000},
        {c:"Carrefour","cat":"Supermercado",m:127664},
        {c:"Pedidos Ya market","cat":"Supermercado",m:21288},
        {c:"Super Manzanares","cat":"Supermercado",m:15900},
        {c:"Super Manzanares (Tito)","cat":"Supermercado",m:32898},
        {c:"Merpago interseller (?)","cat":"Otros",m:120273},
        {c:"Merpago hollsen (?)","cat":"Otros",m:73500},
        {c:"Merpago bourbonrosado (?)","cat":"Otros",m:10500},
        {c:"Baby cottons (Tito)","cat":"Otros",m:26500},
        {c:"Telviso Hogar ×2","cat":"Hogar",m:57556},
        {c:"Edenor (luz)","cat":"Servicios",m:26731},
        {c:"Telecentro wifi (Tito)","cat":"Servicios",m:60498},
        {c:"Payu-Uber","cat":"Transporte",m:50252},
        {c:"Payu-Uber (Tito)","cat":"Transporte",m:29880},
        {c:"Netflix","cat":"Suscripciones",m:22648},
        {c:"Groovy Pets","cat":"Mascota",m:30000},
        {c:"Groovy Pets (Tito)","cat":"Mascota",m:86400},
        {c:"Merpago mascotas (Tito)","cat":"Mascota",m:65800},
        {c:"Fudo soma pastas (Tito)","cat":"Restaurant",m:67500},
        {c:"Impuestos y sellos AMEX","cat":"Impuestos",m:26934},
      ] },
  ]
};

const CAT_COLOR={Expensas:"#15616d",Servicios:"#3f8c98",Limpieza:"#6aa6ae",Pilates:"#9b6a9e",
  Suscripciones:"#8a8f98",Supermercado:"#3b82c4","Verdulería":"#5aa469",Delivery:"#e0894a",
  Restaurant:"#c2556b",Cafecito:"#a9772f",Transporte:"#4aa3a0",Viaje:"#d4a53a",
  Mascota:"#7a6fc0",Hogar:"#b07d56",Impuestos:"#9aa0a6",Otros:"#b9bdc2"};

const nf=new Intl.NumberFormat("es-AR",{maximumFractionDigits:0});
const money=n=>"$"+nf.format(Math.round(n));
const pct=(n,d)=>d?Math.round(n/d*1000)/10:0;
const sum=a=>a.reduce((s,x)=>s+x,0);
const totalMes=m=>sum(m.caja.map(x=>x.m))+sum(m.amex.map(x=>x.m));
function aggCat(items){const o={};items.forEach(i=>o[i.cat]=(o[i.cat]||0)+i.m);
  return Object.entries(o).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);}

function barRows(entries,total,colorFn){
  const max=Math.max(...entries.map(e=>e.v),1);
  return entries.map(e=>{const col=colorFn(e.k);
    return `<div class="row"><div class="lbl"><span class="dot" style="background:${col}"></span><span class="txt" title="${e.k}">${e.k}</span></div>
      <div class="bar"><span style="width:${Math.max(e.v/max*100,2)}%;background:${col}"></span></div>
      <div class="amt">${money(e.v)}<span class="pct">${pct(e.v,total)}%</span></div></div>`;}).join("");
}

function catAccordion(items,total){
  const groups={};
  items.forEach(i=>{(groups[i.cat]=groups[i.cat]||[]).push(i);});
  const order=Object.keys(groups).sort((a,b)=>sum(groups[b].map(x=>x.m))-sum(groups[a].map(x=>x.m)));
  const max=Math.max(...order.map(k=>sum(groups[k].map(x=>x.m))),1);
  return order.map(k=>{
    const its=groups[k].slice().sort((a,b)=>b.m-a.m);
    const v=sum(its.map(x=>x.m)), col=CAT_COLOR[k]||"#b9bdc2";
    const sub=its.map(it=>`<div class="subrow"><span class="sc">${it.c}</span><span class="sm">${money(it.m)} <span class="pct" style="color:var(--muted)">${pct(it.m,v)}%</span></span></div>`).join("");
    return `<details class="catrow">
      <summary><span class="caret"></span>
        <span class="lbl"><span class="dot" style="background:${col}"></span><span class="txt" title="${k}">${k}</span></span>
        <span class="bar"><span style="width:${Math.max(v/max*100,2)}%;background:${col}"></span></span>
        <span class="amt">${money(v)}<span class="pct">${pct(v,total)}%</span></span>
      </summary>
      <div class="subitems">${sub}</div>
    </details>`;
  }).join("");
}

function monthHTML(m){
  const cajaT=sum(m.caja.map(x=>x.m)), amexT=sum(m.amex.map(x=>x.m)), total=cajaT+amexT;
  const ingTot=DATA.ingresos.loli+DATA.ingresos.tito;
  const corrLoli=total*DATA.split.loli, corrTito=total*DATA.split.tito;
  const shLoli=pct(corrLoli,DATA.ingresos.loli), shTito=pct(corrTito,DATA.ingresos.tito);
  const ap=m.aportes||{loli:0,tito:0}, apT=ap.loli+ap.tito, dif=apT-total;
  const cats=aggCat([...m.caja,...m.amex]), top=cats[0];
  const medios=[{k:"Caja Santander (débito)",v:cajaT,c:"#15616d"},{k:"AMEX (tarjeta)",v:amexT,c:"#c2556b"}];
  const sugLoli=total*DATA.split.loli, sugTito=total*DATA.split.tito;

  const FIJOS=["Expensas","Servicios","Limpieza","Pilates","Suscripciones"];
  const fijosCat=sum([...m.caja,...m.amex].filter(x=>FIJOS.includes(x.cat)).map(x=>x.m));
  const varCat=total-fijosCat, rem=apT-fijosCat;
  const varTop=cats.filter(c=>!FIJOS.includes(c.k)).slice(0,3);
  let porque="";
  if(apT && dif<0){
    porque=`<div class="card" style="margin-top:16px">
      <h3>¿Por qué faltó? <span class="tot num">faltaron ${money(-dif)}</span></h3>
      <p class="lead">El aporte de ${money(apT)} no alcanza ni para los fijos más un mes normal.</p>
      <div class="whybars">
        <div class="wb"><span class="wl">Aportaron</span><div class="wtrack"><div class="wfill" style="width:100%;background:var(--accent)">${money(apT)}</div></div></div>
        <div class="wb"><span class="wl">Fijos</span><div class="wtrack"><div class="wfill" style="width:${Math.min(fijosCat/total*100,100)}%;background:#6aa6ae">${money(fijosCat)}</div></div></div>
        <div class="wb"><span class="wl">Variable</span><div class="wtrack"><div class="wfill" style="width:${Math.min(varCat/total*100,100)}%;background:var(--bad)">${money(varCat)}</div></div></div>
      </div>
      <ul class="ins" style="margin-top:12px">
        <li>Los <b>gastos fijos</b> (expensas, luz/wifi, limpieza, Pilates, Netflix) ya se comieron <b>${money(fijosCat)}</b>: el <b>${pct(fijosCat,apT)}%</b> del aporte.</li>
        <li>Quedaban solo <b>${money(Math.max(rem,0))}</b> para el resto, pero el <b>gasto variable</b> fue <b>${money(varCat)}</b>.</li>
        <li class="bad">Por eso salieron <b>${money(-dif)}</b> de más de la caja.</li>
        ${varTop.length?`<li>Lo variable más pesado: ${varTop.map(v=>`<b>${v.k}</b> ${money(v.v)}`).join(" · ")}.</li>`:""}
      </ul>
    </div>`;
  }
  const ins=[];
  ins.push(`Gasto conjunto: <b>${money(total)}</b> — el <b>${pct(total,ingTot)}%</b> del ingreso del hogar (${money(ingTot)}).`);
  if(top) ins.push(`Lo más pesado fue <b>${top.k}</b>: <b>${money(top.v)}</b> (${pct(top.v,total)}% del total).`);
  if(dif<0) ins.push({cls:"bad",html:`Pusieron <b>${money(apT)}</b> y el gasto fue <b>${money(total)}</b>: faltaron <b>${money(-dif)}</b>. El aporte de $2,5M no alcanza para cubrir un mes.`});
  else if(apT) ins.push({cls:"good",html:`Pusieron <b>${money(apT)}</b> y gastaron <b>${money(total)}</b>: sobraron <b>${money(dif)}</b>.`});
  ins.push({cls:"warn",html:`Con el 40/60 los gastos se llevan el <b>${shLoli}%</b> de tu ingreso y el <b>${shTito}%</b> del de Tito. Con proporcional a ingresos (33/67) sería <b>${pct(total,ingTot)}%</b> parejo.`});

  return `<section class="month" id="m-${m.id}" role="tabpanel">
    <div class="tiles">
      <div class="tile"><div class="k">Gasto conjunto</div><div class="v">${money(total)}</div>
        <div class="d">Caja ${money(cajaT)} · AMEX ${money(amexT)}</div></div>
      <div class="tile"><div class="k">Sobre ingreso hogar</div><div class="v">${pct(total,ingTot)}%</div>
        <div class="d">de ${money(ingTot)} netos</div></div>
      <div class="tile"><div class="k">Aportes del mes</div><div class="v">${apT?money(apT):"—"}</div>
        <div class="d">${apT?`Vos ${money(ap.loli)} · Tito ${money(ap.tito)}`:"sin datos"}</div></div>
      <div class="tile"><div class="k">${dif<0?"Faltó":"Sobró"}</div><div class="v ${dif<0?"bad":"good"}">${apT?money(Math.abs(dif)):"—"}</div>
        <div class="d">aportes − gasto</div></div>
    </div>

    <div class="split">
      <div class="s"><div class="who">Te toca a vos (40%)</div><div class="mt num">${money(corrLoli)}</div><div class="sh">${shLoli}% de tu ingreso</div></div>
      <div class="s"><div class="who">Le toca a Tito (60%)</div><div class="mt num">${money(corrTito)}</div><div class="sh">${shTito}% de su ingreso</div></div>
    </div>

    <div class="cols">
      <div class="card">
        <h3>En qué se gastó <span class="tot num">${money(total)}</span></h3>
        <p class="lead">Todo lo conjunto del mes (caja Santander + AMEX). Tocá la flechita de cada categoría para ver el detalle.</p>
        <div class="bars">${catAccordion([...m.caja,...m.amex],total)}</div>
      </div>
      <div class="card">
        <h3>Por medio de pago</h3>
        <p class="lead">De dónde salió la plata.</p>
        <div class="bars">${barRows(medios.map(x=>({k:x.k,v:x.v})),total,k=>k[0]==="C"?"#15616d":"#c2556b")}</div>
        ${m.usd?`<div class="usd-note">✈️ Además, <b>U$S ${nf.format(m.usd)}</b> de gastos en el exterior (viajes), que se dividen 50/50 → <b>U$S ${nf.format(Math.round(m.usd/2))}</b> cada uno. Se pagaron con los dólares de la caja, así que no se cobra la percepción del 30% (se reintegra).</div>`:""}
        <div class="sug"><div class="st">Sugerido para cubrir un mes así</div>
          <div class="vals"><div>Vos<b>${money(sugLoli)}</b></div><div>Tito<b>${money(sugTito)}</b></div>
          <div>Total<b>${money(total)}</b></div></div></div>
      </div>
    </div>

    ${porque}
    <div class="card" style="margin-top:16px">
      <h3>Para pensar el ahorro</h3>
      <ul class="ins">${ins.map(i=>typeof i==="string"?`<li>${i}</li>`:`<li class="${i.cls}">${i.html}</li>`).join("")}</ul>
      ${m.id==="sep"?`<div class="note">Hay <b>~$498.000</b> en "Otros" que todavía no sé qué son (Merpago interseller $120k, hollsen $73,5k, Cabrera $150k, "Ya ganaste" $58k, bourbonrosado, DEBIN $42k, ebanxsa). Si me decís qué son, los reclasifico y el análisis queda más fino.</div>`:`<div class="note">Mandame el resumen del próximo mes (AMEX + caja Santander) y lo agrego como pestaña nueva.</div>`}
    </div>
  </section>`;
}

function annualHTML(){
  const rows=DATA.meses.map(m=>{const t=totalMes(m);const ap=(m.aportes||{loli:0,tito:0});
    return {nombre:m.nombre.split(" ")[0],t,ap:ap.loli+ap.tito};});
  const max=Math.max(...rows.map(r=>r.t),1);
  const ingTot=DATA.ingresos.loli+DATA.ingresos.tito;
  const bars=rows.map(r=>`<div class="ab"><div class="m">${r.nombre}</div>
    <div class="track"><div class="fill" style="width:${Math.max(r.t/max*100,12)}%">${money(r.t)}</div></div></div>`).join("");
  const trs=DATA.meses.map(m=>{const t=totalMes(m);const ap=(m.aportes||{loli:0,tito:0});const apT=ap.loli+ap.tito;const dif=apT-t;
    return `<tr><td>${m.nombre.split(" ")[0]}</td><td>${money(t)}</td><td>${apT?money(apT):"—"}</td>
      <td class="${dif<0?"bad":"good"}">${apT?(dif<0?"−":"+")+money(Math.abs(dif)):"—"}</td>
      <td>${pct(t,ingTot)}%</td></tr>`;}).join("");
  // category trend
  const allCats={};DATA.meses.forEach(m=>aggCat([...m.caja,...m.amex]).forEach(e=>{allCats[e.k]=allCats[e.k]||{};allCats[e.k][m.id]=e.v;}));
  const catNames=Object.keys(allCats).sort((a,b)=>sum(Object.values(allCats[b]))-sum(Object.values(allCats[a])));
  const cths=DATA.meses.map(m=>`<th>${m.nombre.split(" ")[0]}</th>`).join("");
  const ctrs=catNames.map(c=>`<tr><td>${c}</td>${DATA.meses.map(m=>`<td>${allCats[c][m.id]?money(allCats[c][m.id]):"—"}</td>`).join("")}</tr>`).join("");
  return `<section class="month" id="m-anual" role="tabpanel">
    <div class="card"><h3>Gasto conjunto por mes</h3>
      <p class="lead">Sobre un ingreso del hogar de ${money(ingTot)}.</p>
      <div class="annual-bars">${bars}</div></div>
    <div class="card" style="margin-top:16px"><h3>Aportes vs. gasto</h3>
      <div class="tbl-scroll"><table class="mt"><thead><tr><th>Mes</th><th>Gastaron</th><th>Pusieron</th><th>Dif.</th><th>% ingreso</th></tr></thead>
      <tbody>${trs}</tbody></table></div></div>
    <div class="card" style="margin-top:16px"><h3>Categorías mes a mes</h3>
      <p class="lead">Para ver qué sube y qué baja.</p>
      <div class="tbl-scroll"><table class="mt"><thead><tr><th>Categoría</th>${cths}</tr></thead><tbody>${ctrs}</tbody></table></div></div>
  </section>`;
}

const main=document.getElementById("main"), tabs=document.getElementById("tabs");
main.innerHTML=DATA.meses.map(monthHTML).join("")+annualHTML();
const tabDefs=[...DATA.meses.map(m=>({id:m.id,label:m.nombre.split(" ")[0]})),{id:"anual",label:"Resumen"}];
tabs.innerHTML=tabDefs.map(t=>`<button class="tab" role="tab" data-id="${t.id}" aria-selected="false">${t.label}</button>`).join("");
function show(id){
  document.querySelectorAll("section.month").forEach(s=>s.classList.toggle("active",s.id==="m-"+id));
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.id===id));
  try{localStorage.setItem("lt-tab",id)}catch(e){}
  if(location.hash.slice(1)!==id) history.replaceState(null,"","#"+id);
}
tabs.addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)show(b.dataset.id);});
let start=location.hash.slice(1);const valid=tabDefs.map(t=>t.id);
if(!valid.includes(start)){try{start=localStorage.getItem("lt-tab")}catch(e){}}
if(!valid.includes(start)) start="sep";
show(start);
</script>
