<title>Finanzas Loli & Tito</title>
<meta name="description" content="Dashboard mensual de gastos conjuntos">
<style>
/* Layout: sticky header con pestañas por mes; panel por mes con tiles de resumen arriba y dos columnas de desglose debajo. */
:root{
  --bg:#f4f2ee; --surface:#ffffff; --surface-2:#faf8f4; --fg:#20242b; --muted:#6b7280;
  --line:#e4e0d8; --accent:#15616d; --accent-soft:#d7e6e6; --gold:#b4842f;
  --good:#1f7a5a; --good-bg:#dff0e6; --bad:#b4453a; --bad-bg:#f6dedb;
  --c-super:#3b82c4; --c-delivery:#e0894a; --c-resto:#c2556b; --c-cafe:#a9772f;
  --c-verdu:#5aa469; --c-vet:#7a6fc0; --c-nafta:#6b8a3a; --c-transp:#4aa3a0;
  --c-viaje:#d4a53a; --c-farma:#cf6f8a; --c-tram:#7f8893; --c-otros:#9aa0a6;
  --c-expensas:#15616d; --c-servicios:#3f8c98; --c-limpieza:#6aa6ae;
  --c-antonio:#c08a3e; --c-susc:#8a8f98;
  --r:14px; --shadow:0 1px 3px rgba(20,24,31,.06),0 6px 20px rgba(20,24,31,.05);
  --font-d:"Fraunces",Georgia,serif; --font-b:"Instrument Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15181d; --surface:#1e222a; --surface-2:#222732; --fg:#eceef2; --muted:#9aa2b0;
  --line:#2c313b; --accent:#58b6c2; --accent-soft:#1d3942; --gold:#d9ad5e;
  --good:#6fd6a8; --good-bg:#16352a; --bad:#f09a8f; --bad-bg:#3a211e;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15181d; --surface:#1e222a; --surface-2:#222732; --fg:#eceef2; --muted:#9aa2b0;
  --line:#2c313b; --accent:#58b6c2; --accent-soft:#1d3942; --gold:#d9ad5e;
  --good:#6fd6a8; --good-bg:#16352a; --bad:#f09a8f; --bad-bg:#3a211e;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);line-height:1.45;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.head-row{max-width:1040px;margin:0 auto;padding:14px 16px 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand{font-family:var(--font-d);font-weight:600;font-size:1.3rem;letter-spacing:.2px}
.brand .amp{color:var(--accent)}
.sub{color:var(--muted);font-size:.82rem}
.ingresos-chip{margin-left:auto;font-size:.78rem;color:var(--muted);white-space:nowrap}
.ingresos-chip b{color:var(--fg);font-variant-numeric:tabular-nums}
.tabs{max-width:1040px;margin:0 auto;padding:10px 16px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  font-family:inherit;font-size:.9rem;font-weight:600;padding:8px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;border-bottom-left-radius:999px;transition:.15s}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .tab[aria-selected="true"],
:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#0b1416}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#0b1416}}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{margin-top:20px}
section.month{display:none}
section.month.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){section.month.active{animation:none}.bar span{transition:none}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:720px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow)}
.tile .k{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tile .v{font-family:var(--font-d);font-size:1.55rem;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .d{font-size:.78rem;color:var(--muted);margin-top:4px}
.tile.hero{grid-column:span 2}
@media(max-width:720px){.tile.hero{grid-column:span 2}}
.tile .v.good{color:var(--good)} .tile .v.bad{color:var(--bad)}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow)}
.card h3{font-family:var(--font-d);font-size:1.08rem;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3 .tot{font-family:var(--font-b);font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card .lead{font-size:.8rem;color:var(--muted);margin:2px 0 12px}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.row{display:grid;grid-template-columns:118px 1fr auto;align-items:center;gap:10px}
.row .lbl{font-size:.82rem;display:flex;align-items:center;gap:7px;min-width:0}
.row .lbl .dot{width:9px;height:9px;border-radius:3px;flex:none}
.row .lbl .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:16px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.row .amt{font-size:.82rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .amt .pct{color:var(--muted);font-size:.72rem;margin-left:5px}
.split{display:flex;gap:10px;margin-top:10px}
.split .s{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.split .s .who{font-size:.76rem;color:var(--muted);font-weight:600}
.split .s .mt{font-family:var(--font-d);font-size:1.15rem;font-variant-numeric:tabular-nums;margin-top:2px}
.split .s .sh{font-size:.72rem;color:var(--muted);margin-top:2px}
ul.ins{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:9px}
ul.ins li{font-size:.86rem;padding-left:20px;position:relative;color:var(--fg)}
ul.ins li::before{content:"";position:absolute;left:4px;top:7px;width:7px;height:7px;border-radius:2px;background:var(--accent)}
ul.ins li.warn::before{background:var(--gold)} ul.ins li.good::before{background:var(--good)}
ul.ins b{font-variant-numeric:tabular-nums}
.note{font-size:.78rem;color:var(--muted);margin-top:14px;padding:11px 13px;background:var(--surface-2);border:1px dashed var(--line);border-radius:10px}
.annual-bars{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.ab{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center}
.ab .m{font-weight:600;font-size:.9rem}
.ab .track{background:var(--surface-2);border-radius:8px;height:34px;position:relative;overflow:hidden}
.ab .fill{height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--gold)));display:flex;align-items:center;justify-content:flex-end;padding-right:10px;color:#fff;font-size:.82rem;font-variant-numeric:tabular-nums;font-weight:600;border-radius:8px;min-width:54px}
:root[data-theme="dark"] .ab .fill,:root:not([data-theme="light"]) .ab .fill{color:#0b1416}
table.mt{width:100%;border-collapse:collapse;font-size:.84rem;margin-top:6px}
table.mt th,table.mt td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.mt th:first-child,table.mt td:first-child{text-align:left}
table.mt th{color:var(--muted);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em}
.tbl-scroll{overflow-x:auto}
.foot{text-align:center;color:var(--muted);font-size:.76rem;margin-top:26px}
.sec-title{font-family:var(--font-d);font-size:.95rem;color:var(--muted);margin:18px 2px 8px;font-weight:600}
</style>

<header class="top">
  <div class="head-row">
    <div class="brand">Loli <span class="amp">&amp;</span> Tito</div>
    <div class="sub">Gastos conjuntos · reparto 40 / 60</div>
    <div class="ingresos-chip">Ingresos: Vos <b>$3.000.000</b> · Tito <b>$6.000.000</b></div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
</header>
<main class="wrap" id="main"></main>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<script>
const DATA = {
  ingresos:{loli:3000000, tito:6000000},
  split:{loli:0.40, tito:0.60},
  nombres:{loli:"Vos", tito:"Tito"},
  meses:[
    { id:"jun", nombre:"Junio 2026",
      fijos:[
        {grupo:"Expensas", concepto:"Expensas Pilar", monto:398000},
        {grupo:"Servicios", concepto:"Luz Núñez", monto:52392},
        {grupo:"Servicios", concepto:"Wifi Núñez", monto:38940},
        {grupo:"Suscripciones", concepto:"Netflix", monto:22648},
      ],
      amex:[
        {detalle:"Hamburguesería Colegiales", cat:"Restaurant", monto:47000},
      ] },
    { id:"jul", nombre:"Julio 2026",
      fijos:[
        {grupo:"Expensas", concepto:"Expensas Núñez", monto:415000},
        {grupo:"Expensas", concepto:"Expensas Pilar", monto:398000},
        {grupo:"Servicios", concepto:"Luz Núñez", monto:21318},
        {grupo:"Servicios", concepto:"Luz Pilar", monto:24579},
        {grupo:"Servicios", concepto:"Wifi Núñez", monto:44898},
        {grupo:"Servicios", concepto:"Wifi Pilar", monto:45238},
        {grupo:"Limpieza", concepto:"Limpieza Núñez", monto:198000},
        {grupo:"Limpieza", concepto:"Limpieza Pilar", monto:63000},
        {grupo:"Antonio", concepto:"Paseadora Antonio", monto:98000},
        {grupo:"Suscripciones", concepto:"Netflix", monto:22648},
      ],
      amex:[
        {detalle:"Merpago Delfin", cat:"Supermercado", monto:23500},
        {detalle:"Groovypets", cat:"Veterinaria", monto:50900},
        {detalle:"Merpago-h2soap", cat:"Otros", monto:14944},
        {detalle:"Groovypets", cat:"Veterinaria", monto:44500},
        {detalle:"Rappi", cat:"Delivery", monto:50897},
        {detalle:"Super Manzanares", cat:"Supermercado", monto:25000},
        {detalle:"Pedidos Ya market", cat:"Supermercado", monto:34800},
        {detalle:"Rappi Super", cat:"Delivery", monto:156500},
        {detalle:"La Noire Café + Razo-Razo", cat:"Cafecito", monto:48900},
        {detalle:"Merpago Delfin + Super Paroissien", cat:"Supermercado", monto:92000},
        {detalle:"Solileb", cat:"Cafecito", monto:74000},
        {detalle:"Rappi", cat:"Delivery", monto:22162},
        {detalle:"JETSMART (vuelos)", cat:"Viaje", monto:743000},
        {detalle:"Rappi", cat:"Delivery", monto:17192},
        {detalle:"Rappi", cat:"Delivery", monto:37492},
        {detalle:"Parmegiano", cat:"Restaurant", monto:46458},
        {detalle:"Santicheese", cat:"Restaurant", monto:109800},
        {detalle:"dlorappi", cat:"Delivery", monto:6490},
        {detalle:"Merpago-Delfin", cat:"Supermercado", monto:30246},
        {detalle:"Vacalin", cat:"Supermercado", monto:33100},
        {detalle:"Rappi", cat:"Delivery", monto:32554},
        {detalle:"Rappi", cat:"Delivery", monto:64450},
        {detalle:"Demente", cat:"Supermercado", monto:14000},
        {detalle:"Evelia", cat:"Restaurant", monto:160400},
      ] },
  ]
};

const CAT_COLOR={Supermercado:"--c-super",Delivery:"--c-delivery",Restaurant:"--c-resto",
  Cafecito:"--c-cafe","Verdulería":"--c-verdu",Veterinaria:"--c-vet",Nafta:"--c-nafta",
  Transporte:"--c-transp",Viaje:"--c-viaje",Farmacia:"--c-farma","Trámites":"--c-tram",Otros:"--c-otros"};
const GRP_COLOR={Expensas:"--c-expensas",Servicios:"--c-servicios",Limpieza:"--c-limpieza",
  Antonio:"--c-antonio",Suscripciones:"--c-susc"};
const GRP_LABEL={Expensas:"Expensas",Servicios:"Luz · Wifi",Limpieza:"Limpieza",
  Antonio:"Antonio (paseadora)",Suscripciones:"Suscripciones"};

const nf=new Intl.NumberFormat("es-AR",{maximumFractionDigits:0});
const money=n=>"$"+nf.format(Math.round(n));
const pct=(n,d)=>d?Math.round(n/d*1000)/10:0;
const sum=a=>a.reduce((s,x)=>s+x,0);
function agg(items,key){const m={};items.forEach(i=>{m[i[key]]=(m[i[key]]||0)+i.monto});
  return Object.entries(m).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);}

function barRows(entries,colorMap,total,labelMap){
  const max=Math.max(...entries.map(e=>e.v),1);
  return entries.map(e=>{
    const col=`var(${colorMap[e.k]||"--c-otros"})`;
    const lab=(labelMap&&labelMap[e.k])||e.k;
    return `<div class="row"><div class="lbl"><span class="dot" style="background:${col}"></span><span class="txt" title="${lab}">${lab}</span></div>
      <div class="bar"><span style="width:${Math.max(e.v/max*100,2)}%;background:${col}"></span></div>
      <div class="amt">${money(e.v)}<span class="pct">${pct(e.v,total)}%</span></div></div>`;
  }).join("");
}

function monthHTML(m){
  const fijosT=sum(m.fijos.map(f=>f.monto));
  const amexT=sum(m.amex.map(a=>a.monto));
  const total=fijosT+amexT;
  const ingTot=DATA.ingresos.loli+DATA.ingresos.tito;
  const corrLoli=total*DATA.split.loli, corrTito=total*DATA.split.tito;
  const shLoli=pct(corrLoli,DATA.ingresos.loli), shTito=pct(corrTito,DATA.ingresos.tito);
  const fg=agg(m.fijos,"grupo"), ac=agg(m.amex,"cat");
  const combined=[...fg.map(e=>({k:GRP_LABEL[e.k]||e.k,v:e.v})),...ac].sort((a,b)=>b.v-a.v).slice(0,5);
  const topCat=ac[0];
  // insights
  const ins=[];
  ins.push(`Gasto conjunto del mes: <b>${money(total)}</b> — el <b>${pct(total,ingTot)}%</b> del ingreso del hogar (${money(ingTot)}).`);
  if(topCat) ins.push(`Lo más alto de la AMEX fue <b>${topCat.k}</b> con <b>${money(topCat.v)}</b> (${pct(topCat.v,amexT)}% de la tarjeta).`);
  ins.push({cls:"warn",html:`Con el 40/60 los gastos conjuntos se llevan el <b>${shLoli}%</b> de tu ingreso y el <b>${shTito}%</b> del de Tito. Con el proporcional a ingresos (33/67) sería <b>${pct(total,ingTot)}%</b> parejo para los dos.`});
  const superAmex=ac.find(e=>e.k==="Supermercado"), deli=ac.find(e=>e.k==="Delivery");
  if(superAmex&&deli) ins.push({cls:"good",html:`Comida fuera de casa (Delivery + Restaurant + Cafecito) vs. super: mirá si conviene volcar algo de delivery a super para recortar.`});

  return `<section class="month" id="m-${m.id}" role="tabpanel">
    <div class="tiles">
      <div class="tile hero"><div class="k">Gasto conjunto</div><div class="v">${money(total)}</div>
        <div class="d">Fijos ${money(fijosT)} · AMEX ${money(amexT)}</div></div>
      <div class="tile"><div class="k">Sobre ingreso hogar</div><div class="v">${pct(total,ingTot)}%</div>
        <div class="d">de ${money(ingTot)} netos</div></div>
      <div class="tile"><div class="k">Top categoría</div><div class="v" style="font-size:1.15rem">${topCat?topCat.k:"—"}</div>
        <div class="d">${topCat?money(topCat.v):""}</div></div>
    </div>

    <div class="split">
      <div class="s"><div class="who">Te toca a vos (40%)</div><div class="mt num">${money(corrLoli)}</div><div class="sh">${shLoli}% de tu ingreso</div></div>
      <div class="s"><div class="who">Le toca a Tito (60%)</div><div class="mt num">${money(corrTito)}</div><div class="sh">${shTito}% de su ingreso</div></div>
    </div>

    <div class="cols">
      <div class="card">
        <h3>Gastos AMEX <span class="tot num">${money(amexT)}</span></h3>
        <p class="lead">Tarjeta conjunta, por categoría. Dólares de viaje van 50/50.</p>
        <div class="bars">${ac.length?barRows(ac,CAT_COLOR,amexT):'<p class="lead">Sin gastos de tarjeta este mes.</p>'}</div>
      </div>
      <div class="card">
        <h3>Gastos fijos <span class="tot num">${money(fijosT)}</span></h3>
        <p class="lead">Débitos de la caja de ahorro Santander.</p>
        <div class="bars">${barRows(fg,GRP_COLOR,fijosT,GRP_LABEL)}</div>
        <h3 style="margin-top:18px">Dónde se gastó más <span class="tot num">top 5</span></h3>
        <div class="bars" style="margin-top:8px">${barRows(combined,{},total)}</div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <h3>Para pensar el ahorro</h3>
      <ul class="ins">${ins.map(i=>typeof i==="string"?`<li>${i}</li>`:`<li class="${i.cls}">${i.html}</li>`).join("")}</ul>
      <div class="note">Estos son los meses que ya tenía de la planilla. Mandame el resumen de AMEX + la caja Santander del mes actual y lo agrego como una pestaña nueva, sin tocar nada de lo anterior.</div>
    </div>
  </section>`;
}

function annualHTML(){
  const rows=DATA.meses.map(m=>{
    const t=sum(m.fijos.map(f=>f.monto))+sum(m.amex.map(a=>a.monto));return {nombre:m.nombre,t};});
  const max=Math.max(...rows.map(r=>r.t),1);
  const ingTot=DATA.ingresos.loli+DATA.ingresos.tito;
  const bars=rows.map(r=>`<div class="ab"><div class="m">${r.nombre.split(" ")[0]}</div>
    <div class="track"><div class="fill" style="width:${Math.max(r.t/max*100,10)}%">${money(r.t)}</div></div></div>`).join("");
  // category table across months
  const cats={};DATA.meses.forEach(m=>{m.amex.forEach(a=>{cats[a.cat]=cats[a.cat]||{};cats[a.cat][m.id]=(cats[a.cat][m.id]||0)+a.monto});});
  const catNames=Object.keys(cats).sort((a,b)=>sum(Object.values(cats[b]))-sum(Object.values(cats[a])));
  const ths=DATA.meses.map(m=>`<th>${m.nombre.split(" ")[0]}</th>`).join("");
  const trs=catNames.map(c=>`<tr><td>${c}</td>${DATA.meses.map(m=>`<td>${cats[c][m.id]?money(cats[c][m.id]):"—"}</td>`).join("")}</tr>`).join("");
  return `<section class="month" id="m-anual" role="tabpanel">
    <div class="card"><h3>Gasto conjunto por mes</h3>
      <p class="lead">Total de fijos + AMEX. Sobre un ingreso del hogar de ${money(ingTot)}.</p>
      <div class="annual-bars">${bars}</div></div>
    <div class="card" style="margin-top:16px"><h3>Categorías AMEX mes a mes</h3>
      <p class="lead">Para ver tendencias: qué sube, qué baja.</p>
      <div class="tbl-scroll"><table class="mt"><thead><tr><th>Categoría</th>${ths}</tr></thead><tbody>${trs}</tbody></table></div></div>
  </section>`;
}

// render
const main=document.getElementById("main"), tabs=document.getElementById("tabs");
main.innerHTML=DATA.meses.map(monthHTML).join("")+annualHTML();
const tabDefs=[...DATA.meses.map(m=>({id:m.id,label:m.nombre.split(" ")[0]})),{id:"anual",label:"Resumen"}];
tabs.innerHTML=tabDefs.map(t=>`<button class="tab" role="tab" data-id="${t.id}" aria-selected="false">${t.label}</button>`).join("");

function show(id){
  document.querySelectorAll("section.month").forEach(s=>s.classList.toggle("active",s.id==="m-"+id));
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.id===id));
  try{localStorage.setItem("lt-tab",id)}catch(e){}
  if(location.hash.slice(1)!==id){history.replaceState(null,"","#"+id);}
}
tabs.addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)show(b.dataset.id);});
let start=location.hash.slice(1);
const valid=tabDefs.map(t=>t.id);
if(!valid.includes(start)){try{start=localStorage.getItem("lt-tab")}catch(e){}}
if(!valid.includes(start)) start=DATA.meses[DATA.meses.length-1].id;
show(start);
</script>
